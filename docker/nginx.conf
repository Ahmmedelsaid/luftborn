server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Angular is a single-page app: every unmatched path has to return the shell
    # so the router can handle it. Without this, refreshing /tasks/new is a 404 —
    # the single most common way an SPA deployment breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Translation bundles are not content-hashed, so they must revalidate or a
    # copy fix would never reach a returning visitor.
    location /i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients requesting the
    # previous build's hashed chunks.
    location = /index.html {
        add_header Cache-Control "no-store";

        # Repeated deliberately: nginx does not merge add_header across levels,
        # so a location with any add_header of its own drops every server-level
        # one. Omitting these here would strip the security headers from the
        # only document that renders as a page.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Proxied to the json-server container. Standalone `docker run` has no such
    # upstream; that case is answered below rather than left to time out.
    location /api/ {
        # Docker's embedded DNS. Combined with a variable in `proxy_pass`, this
        # defers name resolution to request time — with a literal hostname nginx
        # resolves at config load and refuses to start when the upstream is
        # absent, which would break a standalone `docker run` entirely.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream http://api:3000;

        proxy_pass $api_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;

        # Without an API the app still boots and shows its error state, which is
        # a far better failure than a blank page.
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"message":"No API upstream. Run the container with `docker compose up` so json-server is reachable at http://api:3000."}';
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Baseline hardening. No CSP here on purpose: it belongs with the real
    # deployment's own script and style policy, and a guessed one is worse than
    # none.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
