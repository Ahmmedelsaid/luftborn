<app-page-header title="Dashboard" [subtitle]="summary()">
  <button matButton="outlined" type="button" (click)="onReload()">
    <mat-icon svgIcon="refresh" aria-hidden="true" />
    Refresh
  </button>
</app-page-header>

<section class="dash__stats" aria-label="Task statistics">
  @if (statisticsLoading()) {
    @for (row of statisticSkeletons; track row) {
      <app-skeleton height="104px" radius="var(--app-radius-md)" />
    }
  } @else {
    @for (statistic of statisticCards(); track statistic.id) {
      <app-stat-card
        [statistic]="statistic"
        [interactive]="isStatisticInteractive(statistic)"
        [active]="isStatisticActive(statistic)"
        (filter)="onStatisticFilter($event)"
      />
    }
  }
</section>

<app-filter-bar
  class="dash__filters"
  [activeStatus]="activeStatus()"
  [activePriorities]="filters().priorities"
  [activeAssigneeIds]="filters().assigneeIds"
  [assignees]="assignees()"
  (statusChange)="onStatusChange($event)"
  (priorityToggle)="onPriorityToggle($event)"
  (assigneeToggle)="onAssigneeToggle($event)"
  (clearFilters)="onClearFilters()"
  (createTask)="onCreateTask()"
/>

@if (loadError(); as error) {
  <app-error-state
    class="dash__error"
    [error]="error"
    title="Could not load your tasks"
    (retry)="onReload()"
  />
} @else {
  <div class="dash__content">
    <app-task-board
      [columns]="board()"
      [loading]="boardLoading()"
      [pendingIds]="pendingIds()"
      [filtered]="hasFilters()"
      (taskMoved)="onTaskMoved($event)"
      (editTask)="onEditTask($event)"
      (deleteTask)="onDeleteTask($event)"
      (openTask)="onOpenTask($event)"
      (createTask)="onCreateTask()"
      (clearFilters)="onClearFilters()"
    />

    <app-activity-feed [activities]="activities()" [loading]="activityLoading()" />
  </div>
}
